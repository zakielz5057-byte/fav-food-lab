    <h1>เมนูอาหารที่ฉันชอบ 3 เมนู</h1>

    <h2>1. ข้าวกะเพราหมูสับ</h2>
    <p>อาหารรสชาติเผ็ดร้อน หอมกลิ่นใบกะเพรา</p>

    <h2>2. ผัดไทย</h2>
    <p>อาหารไทยรสชาติเปรี้ยวหวาน เส้นเหนียวนุ่ม</p>

    <h2>3. ข้าวมันไก่</h2>
    <p>ข้าวหอมมัน เนื้อไก่นุ่ม พร้อมน้ำจิ้มรสเด็ด</p>
